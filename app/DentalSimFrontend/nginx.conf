server {
    listen 8100;
    server_name localhost;

    location /app/chatbot/ {
        alias /usr/share/nginx/html/app/chatbot/;
        index index.html;
        try_files $uri $uri/ /app/chatbot/index.html;
    }

    location /app/chatbot/ {
        proxy_pass http://backend:9004/app/chatbot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 301 /app/chatbot/;
    }
}
