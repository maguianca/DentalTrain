server {
    listen 8100;
    server_name localhost;

    location ~ ^/app/chatbot/(auth|chat|classroom|assignment|diseases|universities|firebase)($|/.*) {
        proxy_pass http://backend:9004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location /app/chatbot/ {
        alias /usr/share/nginx/html/app/chatbot/;
        index index.html;
        try_files $uri $uri/ /app/chatbot/index.html;
    }

    location / {
        return 301 /app/chatbot/;
    }
}
